---
layout: page
---
<div class="badges">
  {% for tag in site.tags %}
    <a href="#{{ tag[0] | slugify }}" class="badge">{{ tag[0] }} ({{ tag[1].size }})</a>
  {% endfor %}
</div>

{% for tag in site.tags %}
  <h2 id="{{ tag[0] | slugify }}">{{ tag[0] }}</h2>
  <ul>
    {% for post in tag[1] %}
      <li>
        <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
        <span style="color:var(--muted); font-size:0.85rem"> - {{ post.date | date: "%d. %b %Y" }}</span>
      </li>
    {% endfor %}
  </ul>
{% endfor %}
