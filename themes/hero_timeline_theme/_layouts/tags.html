---
layout: default
---
<main class="article-container">
<h1 class="page-title">Tags</h1>
<div class="badges tags-cloud">
  {% for tag in site.tags %}
    <a href="{{ '/tag/' | append: tag[0] | relative_url }}" class="badge tags-cloud-badge">{{ tag[0] }} ({{ tag[1].size }})</a>
  {% endfor %}
</div>
</main>
