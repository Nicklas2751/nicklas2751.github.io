---
layout: default
---
<main class="article-container">
  <div class="eyebrow">{% if page.tags %}{{ page.tags | first | upcase }}{% else %}BLOG{% endif %}</div>
  <h1 class="post-title">{{ page.title }}</h1>
  <div class="post-meta">
    {{ page.date | date: "%d. %b %Y" }}
    {% if page.tags %}
      ·
      {% for tag in page.tags %}
        <a href="{{ '/tag/' | append: tag | relative_url }}" class="badge post-tag-badge">{{ tag }}</a>
      {% endfor %}
    {% endif %}
  </div>

  <div class="article-content">
    {{ content }}
  </div>

  <div class="post-footer">
    <a href="{{ '/blog/' | relative_url }}" class="btn">Back to Overview</a>
  </div>
</main>
