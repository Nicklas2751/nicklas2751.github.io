---
layout: default
---
<main class="article-container" style="width:100%">
  <h1 style="margin-bottom:2rem">Blog</h1>

  <div class="blog-list">
    {% for post in site.posts %}
    <article class="blog-card">
      <h2><a href="{{ post.url | relative_url }}" style="color:inherit;text-decoration:none">{{ post.title }}</a></h2>
      <div class="meta">{{ post.date | date: "%d. %b %Y" }} · {% if post.tags %}{{ post.tags | join: ", " }}{% endif %}</div>
      <p>{{ post.excerpt | strip_html | truncatewords: 30 }}</p>
      <a href="{{ post.url | relative_url }}" class="btn" style="margin-top: 1rem;">Read Article</a>
    </article>
    {% endfor %}
  </div>
</main>
